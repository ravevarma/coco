channel = "1.97.0"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
targets = ["x86_64-unknown-uefi", "x86_64-unknown-none", "riscv64gc-unknown-none-elf", "riscv32imac-unknown-none-elf", "aarch64-unknown-none-softfloat", "i686-unknown-linux-gnu"]
profile = "minimal"
