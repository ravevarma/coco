[package]
name = "coco-port"
description = "coco portable bring-up kernel: RISC-V 64/32, AArch64 and x86 (32-bit) backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "coco-port"
test = false
bench = false

[features]
# Negative tests for the boot harness: each must make the run FAIL.
inject-check-failure = []
inject-fault = []

[dependencies]
coco-abi.workspace = true
coco-capability.workspace = true
coco-fdt.workspace = true
coco-ipc.workspace = true
coco-memory.workspace = true
coco-sync.workspace = true

[lints]
workspace = true
